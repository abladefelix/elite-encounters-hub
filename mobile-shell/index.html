<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ashnight</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b0d12;
        color: #f6f3ec;
        text-align: center;
        padding: 2rem;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        margin-bottom: 1.25rem;
      }
      .brand span {
        display: block;
        border-radius: 999px;
        border: 2px solid #c9a227;
      }
      .brand .big {
        width: 34px;
        height: 34px;
      }
      .brand .small {
        width: 22px;
        height: 22px;
        margin-left: -12px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        font-size: 0.9rem;
        opacity: 0.7;
        max-width: 22rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-hidden="true">
        <span class="big"></span><span class="small"></span>
      </div>
      <h1>Ashnight is offline</h1>
      <p>
        You need an internet connection to book vetted cleaning specialists. Reconnect and reopen
        the app to continue.
      </p>
    </main>
  </body>
</html>
